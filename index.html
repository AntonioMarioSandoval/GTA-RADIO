<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>GTA VC Radio</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#ffabf3",
                        "secondary": "#ffffff",
                        "secondary-container": "#00fbfb",
                        "surface-dim": "#131313",
                        "surface-variant": "#353535",
                        "surface-container": "#20201f",
                        "background": "#131313",
                        "on-background": "#e5e2e1",
                        "on-primary": "#5b005b",
                    },
                    "fontFamily": {
                        "label-md": ["Space Mono"],
                        "headline-md": ["Anybody"],
                        "headline-lg": ["Anybody"]
                    }
                }
            }
        }
    </script>
    
    <style>
        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
        }
        .glow-neon { box-shadow: 0 0 20px theme('colors.primary'), inset 0 0 10px theme('colors.primary'); }
        .glow-neon-cyan { box-shadow: 0 0 20px theme('colors.secondary-container'), inset 0 0 10px theme('colors.secondary-container'); }
        .tv-static {
            background-image: repeating-radial-gradient(circle at 17% 32%, rgba(255,255,255,0.03), rgba(255,255,255,0.03) 1px, rgba(0,0,0,0.03) 1px, rgba(0,0,0,0.03) 2px);
        }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        input[type=range][orient=vertical] {
            appearance: slider-vertical;
            width: 100%;
            height: 100%;
            cursor: pointer;
            accent-color: #00fbfb;
        }

        .slide-next { animation: rouletteNext 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .slide-prev { animation: roulettePrev 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        
        @keyframes rouletteNext { 
            0% { transform: translateX(80px); opacity: 0; } 
            100% { transform: translateX(0); opacity: 1; } 
        }
        @keyframes roulettePrev { 
            0% { transform: translateX(-80px); opacity: 0; } 
            100% { transform: translateX(0); opacity: 1; } 
        }
        
        @media (max-height: 500px) and (orientation: landscape) {
            .main-container { padding-top: 4.5rem !important; padding-bottom: 4.5rem !important; }
            .station-header { margin-bottom: 0.5rem !important; }
            .visualizer-container { margin-top: 0.5rem !important; height: 1.5rem !important; }
            .cover-active { width: 140px !important; height: 140px !important; padding: 0.5rem !important; }
            .cover-inactive { width: 100px !important; height: 100px !important; padding: 0.5rem !important; }
            .arrow-icon { font-size: 1.5rem !important; }
        }
    </style>
</head>
<body class="bg-background text-on-background tv-static min-h-screen overflow-hidden flex flex-col font-label-md">
    <div class="scanlines"></div>

    <header class="flex fixed top-0 left-0 w-full z-50 justify-between items-center px-3 md:px-8 py-3 md:py-4 bg-background border-b-4 border-primary drop-shadow-[0_0_10px_rgba(255,171,243,0.8)]">
        <div class="font-headline-md text-lg md:text-3xl text-primary italic tracking-tighter -skew-x-3">
            GTA RADIO (VICE CITY VERSION)
        </div>
        
        <nav class="flex gap-2 md:gap-4">
            <a class="text-on-primary bg-primary border-2 border-black -skew-x-3 px-2 md:px-4 py-1 flex items-center gap-1 md:gap-2 text-xs md:text-base" href="#">
                <span class="inline-block w-1.5 h-1.5 md:w-2 md:h-2 bg-black blink"></span> Estaciones
            </a>
            <a class="hidden sm:block text-primary border-2 border-primary -skew-x-3 px-2 md:px-4 py-1 hover:bg-primary hover:text-black transition-colors text-xs md:text-base" href="#">
                ...
            </a>
        </nav>
    </header>

    <main class="main-container flex-grow flex flex-col justify-center items-center relative z-10 pt-24 pb-32 w-full">
        
        <div class="station-header mb-12 flex flex-col items-center">
            <div id="station-name-top" class="bg-surface-variant px-4 py-2 border-2 border-secondary-container text-secondary-container mt-2 -skew-x-3 shadow-[4px_4px_0px_#000000] uppercase font-headline-md text-xl md:text-2xl tracking-wider">
                Estas Escuchando: 
            </div>
        </div>

        <div class="w-full relative overflow-hidden flex items-center justify-center">
            <button id="prev-btn" class="absolute left-2 md:left-8 z-20 text-primary hover:text-white transition-colors p-2">
                <span class="material-symbols-outlined text-5xl md:text-6xl drop-shadow-md">chevron_left</span>
            </button>
            
            <div id="carousel-container" class="w-full flex justify-center items-center gap-4 md:gap-16 px-12 md:px-24">
            </div>

            <button id="next-btn" class="absolute right-2 md:right-8 z-20 text-primary hover:text-white transition-colors p-2">
                <span class="material-symbols-outlined text-5xl md:text-6xl drop-shadow-md">chevron_right</span>
            </button>
        </div>

        <div class="visualizer-container mt-16 flex items-end justify-center gap-2 h-16 w-full max-w-lg px-8">
            <div class="visualizer-bar w-8 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-8 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-8 bg-secondary-container h-[10%] glow-neon-cyan transition-all duration-75"></div>
            <div class="visualizer-bar w-8 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-8 bg-secondary-container h-[10%] transition-all duration-75"></div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 bg-surface-container border-t-4 border-secondary shadow-[4px_4px_0px_#000000]">
        <button id="toggle-btn" class="flex flex-col items-center justify-center text-secondary border-2 border-secondary bg-surface-dim -skew-x-3 p-3 min-w-[80px] shadow-[4px_4px_0px_#000000] transition-colors">
            <span class="material-symbols-outlined mb-1">power_settings_new</span>
            POWER
        </button>

        <!-- Contenedor del Botón de Volumen con ID para controlarlo por JS -->
        <div id="volume-container" class="flex flex-col items-center justify-center text-secondary border-2 border-secondary bg-surface-dim -skew-x-3 p-3 min-w-[80px] shadow-[4px_4px_0px_#000000] relative cursor-pointer select-none">
            <span class="material-symbols-outlined mb-1">volume_up</span>
            VOLUME
            
            <!-- Quitamos 'group-hover' y agregamos un ID 'volume-popup' para gestionarlo con JavaScript -->
            <div id="volume-popup" class="absolute bottom-full mb-4 left-1/2 -translate-x-1/2 w-8 h-32 bg-surface-dim border-2 border-secondary hidden flex-col justify-start p-1 shadow-[4px_4px_0px_#000000] z-50">
                <input type="range" orient="vertical" id="volume-slider" min="0" max="1" step="0.05" value="0.5">
            </div>
        </div>
    </footer>

    <audio id="audio-player" crossorigin="anonymous"></audio>
    <script src="script.js"></script>
</body>
</html>
