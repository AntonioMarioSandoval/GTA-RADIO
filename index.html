<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>GTA Radio Player</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#ffd700",
                        "secondary": "#ffffff",
                        "secondary-container": "#9ca3af",
                        "surface-dim": "#2a3239",
                        "surface-variant": "#353535",
                        "surface-container": "#11161b",
                        "background": "#1a1f24",
                        "on-background": "#e5e2e1",
                        "on-primary": "#000000",
                    },
                    "fontFamily": {
                        "label-md": ["Space Mono"],
                        "headline-md": ["Anybody"],
                        "headline-lg": ["Anybody"]
                    }
                }
            }
        }
    </script>
    
    <style>
        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
        }
        .glow-neon { box-shadow: 0 0 20px var(--theme-primary), inset 0 0 10px var(--theme-primary) !important; }
        .glow-neon-cyan { box-shadow: 0 0 20px theme('colors.secondary-container'), inset 0 0 10px theme('colors.secondary-container'); }
        .tv-static {
            background-image: repeating-radial-gradient(circle at 17% 32%, rgba(255,255,255,0.03), rgba(255,255,255,0.03) 1px, rgba(0,0,0,0.03) 1px, rgba(0,0,0,0.03) 2px);
        }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        input[type=range][orient=vertical] {
            appearance: slider-vertical;
            width: 100%;
            height: 100%;
            cursor: pointer;
            accent-color: #00fbfb;
        }

        .slide-next { animation: rouletteNext 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .slide-prev { animation: roulettePrev 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        
        @keyframes rouletteNext { 
            0% { transform: translateX(80px); opacity: 0; } 
            100% { transform: translateX(0); opacity: 1; } 
        }
        @keyframes roulettePrev { 
            0% { transform: translateX(-80px); opacity: 0; } 
            100% { transform: translateX(0); opacity: 1; } 
        }

        .fm-text-container {
            filter: drop-shadow(0 0 12px var(--theme-primary, #ffd700));
            transition: filter 0.5s ease;
        }
        .fm-text {
            font-size: 1rem;
            font-weight: 900;
            font-style: italic;
            color: var(--theme-primary, #ffd700);
            transition: color 0.5s ease;
            text-align: center;
            line-height: 1.2;
        }
        @media (min-width: 768px) {
            .fm-text { font-size: 1.8rem; }
        }

        .fm-text-container.tuning-mode {
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3)) !important;
        }
        .fm-text.tuning-mode {
            color: #9ca3af !important;
        }

        .visualizer-container {
            -webkit-box-reflect: below 2px linear-gradient(to bottom, rgba(0,0,0,0) 20%, rgba(0,0,0,0.5) 100%);
        }

        /* Ocultar scrollbars nativas pero permitir scroll en el carrusel */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Máscaras dinámicas para el carrusel de chips */
        .fade-mask-left { background: linear-gradient(to right, var(--theme-bg, #1a1f24) 0%, transparent 100%) !important; }
        .fade-mask-right { background: linear-gradient(to left, var(--theme-bg, #1a1f24) 0%, transparent 100%) !important; }

        @media (max-height: 500px) and (orientation: landscape) {
            .app-header { flex-direction: row !important; padding-top: 4px !important; padding-bottom: 4px !important; border-bottom-width: 2px !important; gap: 8px !important; }
            .app-header > div:first-child { font-size: 1rem !important; } 
            
            .theme-chip { font-size: 0.65rem !important; padding: 2px 10px !important; }
            
            .app-footer { padding-top: 4px !important; padding-bottom: 4px !important; border-top-width: 2px !important; }
            .app-footer > button, .app-footer > div { padding: 4px 12px !important; min-width: auto !important; font-size: 0.7rem !important; line-height: 1 !important; }
            .app-footer .material-symbols-outlined { font-size: 1.4rem !important; margin-bottom: 2px !important; }
            
            .main-container { padding-top: 0.5rem !important; padding-bottom: 7rem !important; justify-content: center !important; gap: 8px !important; }
            
            .station-header { margin-bottom: 0 !important; margin-top: 0 !important; min-height: 50px !important; justify-content: flex-end !important; }
            .fm-text { font-size: 1.1rem !important; }
            .fm-text-container { filter: drop-shadow(0 0 8px var(--theme-primary, #ffd700)) !important; }
            
            .cover-active { width: 115px !important; height: 115px !important; padding: 4px !important; border-width: 3px !important; }
            .cover-inactive { width: 75px !important; height: 75px !important; padding: 4px !important; border-width: 3px !important; }
            .arrow-icon { font-size: 1.5rem !important; }
            #carousel-container { gap: 1.5rem !important; }
            
            .visualizer-container { -webkit-box-reflect: none; margin-top: 0 !important; height: 22px !important; }
            
            .mobile-break { display: block !important; }
        }
    </style>
</head>
<body class="bg-background text-on-background tv-static min-h-screen overflow-hidden flex flex-col font-label-md transition-colors duration-500">
    <div class="scanlines"></div>

    <header class="app-header header-glow flex flex-col md:flex-row fixed top-0 left-0 w-full z-50 justify-between items-center px-2 md:px-8 py-2 md:py-4 bg-background border-b-4 border-primary transition-colors duration-500 gap-2 md:gap-4">
        <div id="main-title" class="font-headline-md text-xl md:text-3xl text-primary italic tracking-tighter -skew-x-3 transition-colors duration-500 flex-shrink-0">
            GTA RADIO
        </div>
        
        <!-- CAROUSEL DE CHIPS -->
        <nav class="w-full md:w-auto relative max-w-[100vw] overflow-hidden flex items-center">
            <div class="fade-mask-left absolute left-0 top-0 bottom-0 w-4 md:w-8 z-10 pointer-events-none transition-colors duration-500"></div>
            <div class="fade-mask-right absolute right-0 top-0 bottom-0 w-4 md:w-8 z-10 pointer-events-none transition-colors duration-500"></div>
            
            <div id="theme-selector-container" class="flex gap-2 md:gap-3 overflow-x-auto hide-scrollbar px-4 md:px-8 py-2 snap-x scroll-smooth items-center">
                <button data-theme="gta3.json" class="theme-chip active bg-primary text-black snap-center flex-shrink-0 px-4 py-1.5 border-2 border-primary text-xs md:text-sm font-label-md cursor-pointer transition-all uppercase whitespace-nowrap shadow-[2px_2px_0px_#000000] -skew-x-3 hover:brightness-110">GTA III</button>
                <button data-theme="gta4.json" class="theme-chip bg-surface-dim text-primary snap-center flex-shrink-0 px-4 py-1.5 border-2 border-primary text-xs md:text-sm font-label-md cursor-pointer transition-all uppercase whitespace-nowrap shadow-[2px_2px_0px_#000000] -skew-x-3 hover:brightness-110">GTA IV</button>
                <button data-theme="vc.json" class="theme-chip bg-surface-dim text-primary snap-center flex-shrink-0 px-4 py-1.5 border-2 border-primary text-xs md:text-sm font-label-md cursor-pointer transition-all uppercase whitespace-nowrap shadow-[2px_2px_0px_#000000] -skew-x-3 hover:brightness-110">GTA Vice City</button>
                <button data-theme="gtasa.json" class="theme-chip bg-surface-dim text-primary snap-center flex-shrink-0 px-4 py-1.5 border-2 border-primary text-xs md:text-sm font-label-md cursor-pointer transition-all uppercase whitespace-nowrap shadow-[2px_2px_0px_#000000] -skew-x-3 hover:brightness-110">GTA San Andreas</button>
                <button data-theme="vcs.json" class="theme-chip bg-surface-dim text-primary snap-center flex-shrink-0 px-4 py-1.5 border-2 border-primary text-xs md:text-sm font-label-md cursor-pointer transition-all uppercase whitespace-nowrap shadow-[2px_2px_0px_#000000] -skew-x-3 hover:brightness-110">GTA Vice City Stories</button>
                <button data-theme="gtav.json" class="theme-chip bg-surface-dim text-primary snap-center flex-shrink-0 px-4 py-1.5 border-2 border-primary text-xs md:text-sm font-label-md cursor-pointer transition-all uppercase whitespace-nowrap shadow-[2px_2px_0px_#000000] -skew-x-3 hover:brightness-110">GTA V</button>
            </div>
        </nav>
    </header>

    <!-- OSD (On-Screen Display) Estilo Windows para Volumen -->
    <div id="osd-volume" class="fixed top-28 md:top-32 left-1/2 -translate-x-1/2 z-[100] flex items-center gap-3 px-4 py-2 md:py-3 bg-surface-dim border-2 border-primary shadow-[4px_4px_0px_#000000] transition-opacity duration-300 opacity-0 pointer-events-none -skew-x-3">
        <span id="osd-icon" class="material-symbols-outlined text-primary text-xl md:text-2xl">volume_up</span>
        <div class="w-32 md:w-48 h-2 md:h-3 bg-surface-variant overflow-hidden">
            <div id="osd-progress" class="h-full bg-secondary-container transition-all duration-100" style="width: 50%;"></div>
        </div>
        <span id="osd-text" class="text-primary font-label-md text-sm md:text-base w-8 text-right">50</span>
    </div>

    <!-- Ajuste pt-28 para compensar el header levemente más alto en móviles -->
    <main class="main-container touch-pan-y flex-grow flex flex-col justify-center items-center relative z-10 pt-28 pb-32 w-full">
        
        <div class="station-header mb-8 md:mb-12 flex flex-col items-center justify-end fm-text-container text-center px-4 min-h-[65px] md:min-h-[100px]">
            <div id="station-name-top" class="fm-text uppercase font-headline-md tracking-wider transition-colors duration-500 -skew-x-3 text-center">
                <span class="block md:inline mobile-break">CARGANDO...</span> 
                <span class="block md:inline mobile-break">POR FAVOR ESPERE</span>
            </div>
        </div>

        <div class="w-full relative overflow-hidden flex items-center justify-center">
            <button id="prev-btn" class="absolute left-2 md:left-8 z-20 text-primary interactive-btn transition-colors p-2 cursor-pointer">
                <span class="material-symbols-outlined text-5xl md:text-6xl drop-shadow-md">chevron_left</span>
            </button>
            
            <div id="carousel-container" class="w-full flex justify-center items-center gap-4 md:gap-16 px-12 md:px-24">
            </div>

            <button id="next-btn" class="absolute right-2 md:right-8 z-20 text-primary interactive-btn transition-colors p-2 cursor-pointer">
                <span class="material-symbols-outlined text-5xl md:text-6xl drop-shadow-md">chevron_right</span>
            </button>
        </div>

        <div class="visualizer-container mt-12 flex items-end justify-center gap-[2px] h-16 w-full max-w-2xl px-6">

    </main>

    <header class="app-footer fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 md:pb-6 border-t-4 shadow-[4px_4px_0px_#000000] transition-colors duration-500">
        <button id="toggle-btn" class="interactive-btn flex flex-col items-center justify-center -skew-x-3 p-1.5 md:p-3 min-w-[65px] md:min-w-[80px] text-xs md:text-base shadow-[4px_4px_0px_#000000] transition-all power-off-btn">
            <span class="material-symbols-outlined mb-0.5 text-lg md:text-2xl">power_settings_new</span>
            <span>POWER</span>
        </button>

        <div class="relative flex items-center">
            <button id="volume-toggle-btn" class="interactive-btn flex flex-col items-center justify-center text-primary border-2 border-primary bg-surface-dim -skew-x-3 p-1.5 md:p-3 min-w-[65px] md:min-w-[80px] text-xs md:text-base shadow-[4px_4px_0px_#000000] transition-all">
                <span id="vol-icon-main" class="material-symbols-outlined mb-0.5 text-lg md:text-2xl">volume_up</span>
                <span>VOLUME</span>
            </button>
            
            <div id="volume-popup" class="absolute bottom-[calc(100%+15px)] left-1/2 -translate-x-1/2 bg-surface-dim border-2 border-primary hidden flex-col items-center p-2 shadow-[4px_4px_0px_#000000] z-50 h-auto w-12 md:w-14 transition-all">
                <input type="range" orient="vertical" id="volume-slider" min="0" max="1" step="0.05" value="0.5" class="h-32 w-full mb-3 cursor-pointer">
                <button id="mute-btn" class="text-primary interactive-btn transition-colors flex items-center justify-center flex-shrink-0" title="Mute/Unmute">
                    <span id="vol-icon-popup" class="material-symbols-outlined text-xl md:text-2xl leading-none">volume_up</span>
                </button>
            </div>
        </div>
        
        <span class="absolute bottom-1 right-2 md:bottom-2 md:right-4 text-[10px] md:text-xs text-primary opacity-60 font-label-md pointer-events-none transition-colors duration-500">v1.0</span>
    </header>

    <audio id="audio-player" crossorigin="anonymous"></audio>

</body>
</html>
