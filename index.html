<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>GTA Radio Player</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#ffabf3",
                        "secondary": "#ffffff",
                        "secondary-container": "#00fbfb",
                        "surface-dim": "#523F4C",
                        "surface-variant": "#353535",
                        "surface-container": "#20201f",
                        "background": "#131313",
                        "on-background": "#e5e2e1",
                        "on-primary": "#5b005b",
                    },
                    "fontFamily": {
                        "label-md": ["Space Mono"],
                        "headline-md": ["Anybody"],
                        "headline-lg": ["Anybody"]
                    }
                }
            }
        }
    </script>
    
    <style>
        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
        }
        .glow-neon { box-shadow: 0 0 20px theme('colors.primary'), inset 0 0 10px theme('colors.primary'); }
        .glow-neon-cyan { box-shadow: 0 0 20px theme('colors.secondary-container'), inset 0 0 10px theme('colors.secondary-container'); }
        .tv-static {
            background-image: repeating-radial-gradient(circle at 17% 32%, rgba(255,255,255,0.03), rgba(255,255,255,0.03) 1px, rgba(0,0,0,0.03) 1px, rgba(0,0,0,0.03) 2px);
        }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        input[type=range][orient=vertical] {
            appearance: slider-vertical;
            width: 100%;
            height: 100%;
            cursor: pointer;
            accent-color: #00fbfb;
        }

        .slide-next { animation: rouletteNext 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .slide-prev { animation: roulettePrev 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        
        @keyframes rouletteNext { 
            0% { transform: translateX(80px); opacity: 0; } 
            100% { transform: translateX(0); opacity: 1; } 
        }
        @keyframes roulettePrev { 
            0% { transform: translateX(-80px); opacity: 0; } 
            100% { transform: translateX(0); opacity: 1; } 
        }

        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        
        /* Efectos de texto principal */
        .fm-text-container {
            filter: drop-shadow(0 0 12px var(--theme-primary, #ffabf3));
            transition: filter 0.5s ease;
        }
        .fm-text {
            font-size: 1.5rem;
            font-weight: 900;
            font-style: italic;
            color: var(--theme-primary, #ffabf3);
            transition: color 0.5s ease;
            text-align: center;
            line-height: 1.2;
        }
        @media (min-width: 768px) {
            .fm-text { font-size: 2rem; }
        }

        /* ESTILOS MIENTRAS SINTONIZA */
        .fm-text-container.tuning-mode {
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3)) !important;
        }
        .fm-text.tuning-mode {
            color: #9ca3af !important;
        }

        /* Optimización Landscape Móvil */
        @media (max-height: 500px) and (orientation: landscape) {
            .app-header { padding-top: 4px !important; padding-bottom: 4px !important; border-bottom-width: 2px !important; }
            .app-header > div:first-child { font-size: 1.1rem !important; } 
            .app-header a, .app-header select { padding: 4px 12px !important; font-size: 0.75rem !important; }
            
            .app-footer { padding-top: 4px !important; padding-bottom: 4px !important; border-top-width: 2px !important; }
            .app-footer > button, .app-footer > div { padding: 4px 12px !important; min-width: auto !important; font-size: 0.7rem !important; line-height: 1 !important; }
            .app-footer .material-symbols-outlined { font-size: 1.4rem !important; margin-bottom: 2px !important; }
            
            .main-container { padding-top: 0.5rem !important; padding-bottom: 7rem !important; justify-content: center !important; gap: 8px !important; }
            
            .station-header { margin-bottom: 0 !important; margin-top: 0 !important; min-height: 50px !important; justify-content: flex-end !important; }
            .fm-text { font-size: 1.1rem !important; }
            .fm-text-container { filter: drop-shadow(0 0 8px var(--theme-primary, #ffabf3)) !important; }
            
            .cover-active { width: 115px !important; height: 115px !important; padding: 4px !important; border-width: 3px !important; }
            .cover-inactive { width: 75px !important; height: 75px !important; padding: 4px !important; border-width: 3px !important; }
            .arrow-icon { font-size: 1.5rem !important; }
            #carousel-container { gap: 1.5rem !important; }
            
            .visualizer-container { margin-top: 0 !important; height: 22px !important; }
            
            /* Fuerza que en celulares horizontales siempre se divida en dos líneas */
            .mobile-break { display: block !important; }
        }
    </style>
</head>
<body class="bg-background text-on-background tv-static min-h-screen overflow-hidden flex flex-col font-label-md transition-colors duration-500">
    <div class="scanlines"></div>

    <header class="app-header header-glow flex fixed top-0 left-0 w-full z-50 justify-between items-center px-3 md:px-8 py-3 md:py-4 bg-background border-b-4 border-primary transition-colors duration-500">
        <div id="main-title" class="font-headline-md text-base md:text-3xl text-primary italic tracking-tighter -skew-x-3 transition-colors duration-500">
            GTA RADIO
        </div>
        
        <nav class="flex gap-2 md:gap-4 items-center">
            <div class="relative -skew-x-3">
                <select id="theme-selector" class="bg-background text-primary border-2 border-primary px-3 md:px-8 py-0.5 md:py-1 text-[10px] md:text-base font-label-md cursor-pointer outline-none hover:bg-primary hover:text-black transition-colors uppercase">
                    <option value="vc.json">Vice City</option>
                    <option value="gta3.json">GTA III</option>
                    <!-- <option value="gta4.json">GTA IV</option> -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-1 md:px-2 text-primary">
                    <span class="material-symbols-outlined text-[12px] md:text-base">expand_more</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-container flex-grow flex flex-col justify-center items-center relative z-10 pt-24 pb-32 w-full">
        
        <div class="station-header mb-8 md:mb-12 flex flex-col items-center justify-end fm-text-container text-center px-4 min-h-[65px] md:min-h-[100px]">
            <div id="station-name-top" class="fm-text uppercase font-headline-md tracking-wider transition-colors duration-500 -skew-x-3 text-center">
                <span class="block md:inline mobile-break">CARGANDO...</span> 
                <span class="block md:inline mobile-break">POR FAVOR ESPERE</span>
            </div>
        </div>

        <div class="w-full relative overflow-hidden flex items-center justify-center">
            <button id="prev-btn" class="absolute left-2 md:left-8 z-20 text-primary hover:text-white transition-colors p-2">
                <span class="material-symbols-outlined text-5xl md:text-6xl drop-shadow-md">chevron_left</span>
            </button>
            
            <div id="carousel-container" class="w-full flex justify-center items-center gap-4 md:gap-16 px-12 md:px-24">
            </div>

            <button id="next-btn" class="absolute right-2 md:right-8 z-20 text-primary hover:text-white transition-colors p-2">
                <span class="material-symbols-outlined text-5xl md:text-6xl drop-shadow-md">chevron_right</span>
            </button>
        </div>

        <div class="visualizer-container mt-16 flex items-end justify-center gap-1 h-16 w-full max-w-lg px-6">
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] glow-neon-cyan transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] glow-neon-cyan transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] glow-neon-cyan transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
            <div class="visualizer-bar w-1.5 md:w-2 bg-secondary-container h-[10%] transition-all duration-75"></div>
        </div>
    </main>

    <header class="app-footer fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 md:pb-6 bg-surface-container border-t-4 border-secondary shadow-[4px_4px_0px_#000000]">
        <button id="toggle-btn" class="flex flex-col items-center justify-center text-secondary border-2 border-secondary bg-surface-dim -skew-x-3 p-1.5 md:p-3 min-w-[65px] md:min-w-[80px] text-xs md:text-base shadow-[4px_4px_0px_#000000] transition-colors">
            <span class="material-symbols-outlined mb-0.5 text-lg md:text-2xl">power_settings_new</span>
            <span>POWER</span>
        </button>

        <div id="volume-container" class="flex flex-col items-center justify-center text-secondary border-2 border-secondary bg-surface-dim -skew-x-3 p-1.5 md:p-3 min-w-[65px] md:min-w-[80px] text-xs md:text-base shadow-[4px_4px_0px_#000000] relative cursor-pointer select-none transition-colors">
            <span class="material-symbols-outlined mb-0.5 text-lg md:text-2xl">volume_up</span>
            <span>VOLUME</span>
            
            <div id="volume-popup" class="absolute bottom-full mb-4 left-1/2 -translate-x-1/2 w-8 h-32 bg-surface-dim border-2 border-secondary hidden flex-col justify-start p-1 shadow-[4px_4px_0px_#000000] z-50">
                <input type="range" orient="vertical" id="volume-slider" min="0" max="1" step="0.05" value="0.5">
            </div>
        </div>
    </header>

    <audio id="audio-player" crossorigin="anonymous"></audio>
    <script src="js/script.js"></script>
</body>
</html>
